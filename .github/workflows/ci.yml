name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.57.0"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            poppler-utils \
            shellcheck
      - run: just bootstrap
      - run: just lint
      - run: just test
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt
      - run: just verify
